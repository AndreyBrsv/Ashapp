name: Build and publish one target
on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      target:
        type: string
        required: true
      arch:
        type: string
        required: false
        default: ''
      publish:
        type: boolean
        default: false
jobs:
  native:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate macOS maintenance helper
        if: runner.os == 'macOS'
        run: xcrun swiftc -typecheck tool/macos_maintenance.swift
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: false
      - name: Validate SDK and dependencies
        working-directory: flutter
        run: |
          flutter --version
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Analyze and test application
        working-directory: flutter
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Test server commands locally
        env:
          PYTHONUTF8: '1'
        run: |
          python -m unittest discover -s tests -v
          bash -n server/remote.sh
          bash -n vendor/amneziawg-install.sh
      - name: Check source for secrets
        run: python tool/check_secrets.py
      - name: Ensure Windows C++ ATL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $atl = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.ATL -property installationPath
          if (-not $atl) {
            $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $installation) { throw 'Install Desktop development with C++ first.' }
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
            $arguments = @('modify', '--installPath', "`"$installation`"", '--add', 'Microsoft.VisualStudio.Component.VC.ATL', '--quiet', '--norestart')
            $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
            if ($process.ExitCode -notin @(0, 3010)) { throw "ATL installation failed: $($process.ExitCode)" }
          }
      - name: Build Windows
        if: runner.os == 'Windows'
        working-directory: flutter
        run: flutter build windows --release --no-pub
      - name: Test Windows private export permissions
        if: runner.os == 'Windows'
        run: |
          cmake -S flutter/windows/runner/tests -B flutter/build/private-export-tests
          cmake --build flutter/build/private-export-tests --config Release
          ctest --test-dir flutter/build/private-export-tests -C Release --output-on-failure
      - name: Build and test macOS
        if: runner.os == 'macOS'
        working-directory: flutter
        env:
          TARGET_ARCH: ${{ inputs.arch }}
        run: |
          HOST_ARCH="$(uname -m)"
          flutter config --no-enable-macos-arm64-only
          if [ "$TARGET_ARCH" = arm64 ]; then EXCLUDED=x86_64; else EXCLUDED=arm64; fi
          printf 'ARCHS = %s\nEXCLUDED_ARCHS = %s\n' "$TARGET_ARCH" "$EXCLUDED" > macos/Runner/Configs/LocalArchitecture.xcconfig
          flutter build macos --release --no-pub
          RESULT=build/macos/RunnerTests.xcresult
          if ! xcodebuild test -project macos/Runner.xcodeproj -scheme Runner -configuration Debug -destination "platform=macOS,arch=$HOST_ARCH" -resultBundlePath "$RESULT" CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual; then
            xcrun xcresulttool get test-results summary --path "$RESULT" --compact || true
            exit 1
          fi
      - name: Package native release
        run: python tool/package_release.py ${{ inputs.target }}
      - name: Smoke test Windows installer in disposable CI profile
        if: runner.os == 'Windows'
        run: python tool/smoke_windows_installer.py
      - name: Verify platform release files
        run: python tool/prepare_release.py release-output --target ${{ inputs.target }}
      - name: Attest native archive provenance
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/attest@4d7d407517fe0a9f57ab8ca277dfd2efb1188c7f
        with:
          subject-path: |
            release-output/*.zip
            release-output/*.exe
            release-output/*.pkg
            release-output/*.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.target }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 7

  publish-target:
    needs: native
    if: inputs.publish && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.target }}
          path: release-output
      - name: Publish platform after its validation
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
        run: |
          test "$(gh api repos/${{ github.repository }}/git/ref/tags/v0.0.15 --jq .object.sha)" = "$GITHUB_SHA"
          sums="release-output/Ashapp-v0.0.15-${TARGET}-SHA256SUMS"
          for file in release-output/*; do
            if [ "$file" != "$sums" ]; then python3 tool/upload_release_assets.py v0.0.15 "$file"; fi
          done
          python3 tool/upload_release_assets.py v0.0.15 "$sums"
