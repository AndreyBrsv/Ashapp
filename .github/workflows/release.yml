name: Verify and release

on:
  push:
    branches: [main]
    tags: [v0.0.15]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish each v0.0.15 target as soon as it passes
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ashapp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-start:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Create source archive
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        run: |
          python3 tool/check_secrets.py
          mkdir release-source
          git archive --format=zip --prefix=Ashapp-0.0.15/ --output=release-source/Ashapp-v0.0.15-source.zip "$GITHUB_SHA"
      - uses: actions/attest@4d7d407517fe0a9f57ab8ca277dfd2efb1188c7f
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' && !github.event.repository.private
        with:
          subject-path: release-source/*.zip
      - name: Create release with matching source
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker="<!-- ashapp-release-run:${GITHUB_RUN_ID}:${GITHUB_SHA} -->"
          if gh release view v0.0.15 --json body --jq .body > existing-notes.txt 2>/dev/null; then
            grep -Fxq "$marker" existing-notes.txt
            test "$(gh api repos/${{ github.repository }}/git/ref/tags/v0.0.15 --jq .object.sha)" = "$GITHUB_SHA"
          else
            test -z "$(git tag -l v0.0.15)"
            cat docs/RELEASE_NOTES.md > release-notes.txt
            printf '\n%s\n' "$marker" >> release-notes.txt
            gh release create v0.0.15 --target "$GITHUB_SHA" --title "Ashapp v0.0.15" --notes-file release-notes.txt --latest
          fi
          python tool/upload_release_assets.py v0.0.15 release-source/*

  native:
    needs: release-start
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows-x64
            arch: ''
          - runner: macos-15-intel
            target: macos-x64
            arch: x86_64
          - runner: macos-15-intel
            target: macos-arm64
            arch: arm64
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-target.yml
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      arch: ${{ matrix.arch }}
      publish: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}

  publish:
    needs: native
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: release-output
          merge-multiple: true
      - name: Publish combined checksums after all platforms succeed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rm release-output/Ashapp-v0.0.15-*-SHA256SUMS
          python tool/prepare_release.py release-output
          python tool/upload_release_assets.py v0.0.15 release-output/SHA256SUMS
