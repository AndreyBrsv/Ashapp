name: ashapp
description: Ashapp desktop server setup application.
publish_to: none
version: 0.0.15+15
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  dartssh2: ^4.1.0
  flutter_secure_storage: ^11.2.0
  file_selector: ^1.1.0
  qr_flutter: ^4.1.0
  path: ^1.9.1
  crypto: 3.0.8
  pinenacl: 0.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
    - assets/remote.sh
    - assets/clients.py
    - assets/amnezia_clients.py
    - assets/amneziawg-install.sh
    - assets/awg_setup.py
    - assets/amnezia_setup.py
    - assets/vless_manager.py
    - assets/security_manager.py
    - assets/firewall_policy.py
    - assets/lifecycle.py
    - assets/docker_setup.py
